'use strict';
const DATA=JSON.parse(document.getElementById('evidenceData').textContent), R=DATA.records, MODELS=DATA.models;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const mark=s=>esc(s).replace(/(aqua\s*sky\s*(?:plus|\+)?|溢康)/ig,'<mark>$1</mark>');
const plain=s=>s.replace(/\[([^\]]*)\]\(https?:\/\/[^)]+\)/g,'$1').replace(/\*\*|^#+\s*/gm,'');
const line=(m,q,contains)=>{const l=rec(m,q).answer.split('\n').find(x=>x.includes(contains));if(!l)throw Error('Missing quote '+m+q+contains);return plain(l)};
const excerpt=(m,q,start,end)=>{const a=rec(m,q).answer;const i=a.indexOf(start),j=end?a.indexOf(end,i):a.length;if(i<0||j<0)throw Error('Missing excerpt '+m+q);return plain(a.slice(i,end?j+end.length:j))};

const Q=q=>`<div class="q">${q}｜${esc(question(q))}</div>`;

'開場先說明：已經觀察到主動出現在候選名單的成果，尤其是台灣製造與 OEM／ODM 情境。這是第一份固定六模型、十二題的基準，不能宣稱比前期提升。表格同時列出問題，避免把 API 成功率當成行銷成果。Google 這一列是 Gemini API，並不是 Google 搜尋的 AI 摘要。',
'客戶會議 2026.09.24｜測試 2026.09.22｜API + 搜尋觀測；非 ChatGPT 網站、Gemini App 或 Google AI Overviews 實測。');

const purpose={A1:'核心品類推薦<br>長期供應商候選',A2:'台灣製造辨識<br>外銷與認證線索',A3:'競品替代機會<br>是否進入比較名單',A4:'RO 應用選型<br>產品與用途的連結',A5:'OEM／ODM 商機<br>研發與代工能力',B1:'品牌價值<br>合作理由與證據',B2:'技術差異<br>膜片比較是否有依據',B3:'同級性能<br>型號與條件是否可比',B4:'認證正確性<br>範圍與型號能否查核',B5:'品管可信度<br>測試方法與標準',B6:'合作可行性<br>條件、起訂量與交期',B7:'售後可預期性<br>年限、範圍與流程'};

add('A 組五題：買家還不知道 AQUASKY 時',`<p class="lead">五種不同的尋找供應商情境，測試品牌能否<b class="accent">主動進入 AI 的回答</b>。</p><table class="question-table"><thead><tr><th>題號</th><th>實際測試問句（原文）</th><th>各題要觀察的差異</th></tr></thead><tbody>${questionRows('A')}</tbody></table>`,
'A1 是最廣的核心品類；A2 加上台灣來源限制；A3 由競爭品牌切入，觀察我們是否成為替代選擇；A4 指定 RO 使用情境；A5 指定代工、研發和認證。這五題不點名 AQUASKY，因此有提及才是主動曝光的線索，但仍要看它是認真推薦、順帶列名，還是寫錯品牌。',
'A1–A5 共 5 題；原題沒有指定 AQUASKY 或 AQUASKY Plus。題目保留原樣，方便每次會議對照。');
add('B 組七題：買家已將 AQUASKY 列入考慮時',`<p class="lead">從「為什麼選你」一路問到技術、採購與售後，測試回答是否<b class="accent">足以支持下一步洽談</b>。</p><table class="question-table b-questions"><thead><tr><th>題號</th><th>實際測試問句（原文）</th><th>各題要觀察的差異</th></tr></thead><tbody>${questionRows('B')}</tbody></table>`,
'B1 是整體合作理由；B2 看技術差異；B3 看同級性能；B4 看認證範圍；B5 看品管和測試；B6 看商務條件；B7 看保固與售後。B2、B3 特別不能只靠形容詞就宣稱勝過競品。B6、B7 則直接影響買家是否能放心詢價或下單。每題單獨提問，B7 未重述壓力桶，這也能幫我們發現同名品牌歧義。',
'B1–B7 共 7 題；已在題目給出 AQUASKY。提及品牌本身不代表回答正確，仍須核對實體、型號與適用條件。');
let matrix=['A1','A2','A3','A4','A5'].map(q=>`<tr><td><b>${q} ${ {A1:'長期供貨廠商',A2:'台灣外銷製造商',A3:'競品與其他選擇',A4:'RO 選購與品牌',A5:'OEM／ODM 工廠'}[q]}</b></td>${Object.keys(MODELS).map(m=>{let r=rec(m,q),s=r.intro_only?'開場†':r.text_brand?(m==='google'&&q==='A4'?'提及*':'提及'):'未提及';return `<td class="${r.intro_only?'flag':r.text_brand?'yes':'no'}"><button data-evidence="${m}:${q}">${s}</button></td>`}).join('')}<td><b>${R.filter(r=>r.question_id===q&&r.text_brand).length}/6</b></td></tr>`).join('');
add('競品替代選擇，是最一致的品牌缺口',`<p class="lead">台灣外銷題覆蓋 <b>4/6</b>；OEM／ODM 題 <b>3/6</b>。<br>A3 詢問 GWS、CIMM 與其他選擇，<b class="warn">六家均未提到 AQUASKY</b>。</p><table class="matrix"><thead><tr><th>未點名品牌的問題</th><th>GPT</th><th>Gemini</th><th>Perplexity</th><th>Claude</th><th>Grok</th><th>DeepSeek</th><th>提及</th></tr></thead><tbody>${matrix}</tbody></table><p class="small">點選任何格子可查看原題與回答全文。* Gemini A4 誤寫中文名稱。† Grok A1、A3、A5 僅回開場。</p><div class="callout">「沒被提到」是本次觀測結果；原因可能是檢索、問題範圍、資料呈現或模型回答不足，須逐題確認。</div>`,
'這一頁用來排序工作，不用來排名模型。A3 是最值得補強的競品替代情境；但 Grok A3 沒有完成比較，本身也是執行品質問題。其餘五家的完整回答仍沒有 AQUASKY。缺口矩陣中的原文可以現場點開。',
'固定分母 6 模型／題；保留回答品質異常，不將其默默排除，也不直接歸因網站內容不足。');
add('台灣製造與 OEM／ODM，已有明確推薦語句',`<div class="cols"><div>${Q('A2')}${quote('openai','A2',excerpt('openai','A2','若你指的是 RO 淨水','TankPAC」與「溢康企業 AQUASKY」'))}<p class="caption">回答把溢康放進優先洽詢名單，並以可查核的認證資料作為篩選依據。</p></div><div>${Q('A5')}${quote('openai','A5',excerpt('openai','A5','若是 RO 淨水、泵浦用壓力桶','先洽 AQUASKY 溢康'))}<p class="caption">回答先依應用區分工廠，再明確建議洽詢 AQUASKY。這比單純出現品牌字樣更有商業意義。</p></div></div><div class="callout">可向客戶報告的成果：在這兩個採購情境，GPT 已主動把 AQUASKY 列為接洽對象。</div>`,
'這兩段是沒有在題目提供品牌名稱的真實回答。A2 是台灣外銷條件，A5 是代工與研發条件。重點是推薦語句和採購理由，不是只在引用區找到網址。認證細節仍應以有效證書與型號為準。',
'原文僅節錄關鍵連續片段；全文與模型引用皆保留於問答庫。');
add('其他模型也能將產品用途連到品牌',`<div class="cols"><div>${Q('A1')}${quote('deepseek','A1',line('deepseek','A1','1. AQUASKY 溢康企業'))}<p class="caption">DeepSeek 將 AQUASKY 放在優先評估名單第一項，內容連到製造能力、OEM／ODM 及官網 FAQ。</p></div><div>${Q('A4')}${quote('grok','A4',excerpt('grok','A4','AQUASKY / 溢康','RO-Plus 系列）'),true)}<p class="caption">Grok 能將品牌與 RO-Plus 系列連結。完整回答另有材質、認證與耐用性宣稱，仍需逐項核對。</p></div></div><div class="callout">已有效被取用的頁型：公司介紹、產品系列、FAQ、認證資料。可沿這些入口補上更完整的採購證據。</div>`,
'這裡展示不同模型的命中，不將單次名單第一項稱為穩定排名。DeepSeek 的搜尋來源是 Exa，與其他模型不同，因此這些差異也包含搜尋工具的影響。Grok 的認證和耐用性形容是模型表述，本簡報沒有替它背書。',
'同一題每模型僅一筆正式回答；不能由單次排序推論長期可見度或模型優劣。');
add('「AQUASKY Plus」文字只出現在 3 筆回答',`<p class="lead">三筆都來自<b>已點名 AQUASKY 的 B 題</b>；A 題為 <b>0/30</b>。<br>網址 <span class="accent">aquaskyplus.com</span> 與 RO-Plus、PumPlus 產品名均不計入 Plus 品牌文字。</p><table><thead><tr><th>模型／問題</th><th>實際回答片段</th><th>如何解讀</th></tr></thead><tbody><tr><td>GPT · B7 保固</td><td>${mark('官方公開的 AQUASKY PLUS 說明書')}</td><td>文件稱呼；不是主動推薦<br>${ev('openai','B7')}</td></tr><tr><td>Perplexity · B6 經銷</td><td>${mark('而 AQUASKY Plus 官網則寫有')}</td><td>網站稱呼；交期仍無數字<br>${ev('perplexity','B6')}</td></tr><tr><td>Claude · B1 合作理由</td><td>${mark('貨櫃內350台AQUASKY PLUS氣壓桶')}</td><td>故事轉述；未獨立查證<br>${ev('claude','B1')}</td></tr></tbody></table><div class="callout caution">若「AQUASKY Plus」是主要對外品牌，應先由客戶確認正式名稱及它與 AQUASKY、溢康的關係，再統一各頁與外部資料。</div>`,
'這是本次對 Plus 的嚴格文字複核結果：共三筆，不把網址裡的 plus 算入。三筆來源的完整問句分別是：'+question('B7')+'；'+question('B6')+'；'+question('B1')+'。Claude 的故事不應被包裝成獨立耐久驗證，尤其不能取代產品測試。',
'大小寫與空格不影響計數；僅計答案正文中的品牌文字，排除網址。原問句可點開各筆全文。');
add('沒有提到品牌時，模型把注意力放在哪裡？',`<div class="cols"><div>${Q('A1')}${quote('openai','A1',excerpt('openai','A1','我會先把 Amtrol','供應商資格審查名單。'),true)}<p class="caption">GPT 以產品結構、文件與保固篩選國際品牌。AQUASKY 在本題沒有進入名單。</p></div><div>${Q('A4')}${quote('openai','A4',excerpt('openai','A4','品牌方面，可先比較','Pentair Everpure'),true)}<p class="caption">RO 情境需要可直接比較的容量、實際出水量、接頭、認證與安裝資料。</p></div></div><div class="callout">建議先補「採購選型表」與「相近型號比較」，並測試它們是否能進入檢索與回答。非泛用品牌新聞稿。</div>`,
'未命中的答案也很有用：可以看見模型正在用哪些資訊做決策。這不是要求抄競爭者，而是準備 AQUASKY 自己可查核、可比較的規格與應用內容。對現有網站先做頁面盤點；有資料但沒被取用，就改善入口與段落對應。',
'A1、A4 各 2/6 提及；A3 為 0/6。例句呈現本次模型行為，不是市場品質排名。');
add('有品牌字樣，仍可能認錯公司或產品',`<div class="cols"><div>${Q('B7')}${quote('perplexity','B7',excerpt('perplexity','B7','就公開資料中較明確的','自購買日起 2 年'),true)}<p class="caption warn"><b>品牌錯認：</b>答案在說 Fluval 水族燈，不能當成溢康壓力桶的保固成果。</p></div><div>${Q('A4')}${quote('google','A4',line('google','A4','Aquasky（天水）'),true)}<p class="caption warn"><b>名稱誤寫：</b>有 AQUASKY 字樣與壓力桶語境，但中文名稱與本專案溢康資料不一致。</p></div></div><div class="callout">品牌頁應清楚綁定：正式中英文名稱、台灣壓力桶製造商、產品系列、官網、法律實體與可驗證來源。</div>`,
'這一頁要讓客戶理解為何不能只看 mention rate。Perplexity B7 字串搜尋會算提及，但整題產品錯誤。Gemini A4 的中文名稱也不正確。原始 B7 只寫 AQUASKY，存在同名品牌歧義；保留原題作基準，後續另加壓力桶語境診斷题，兩種結果分開報。',
'B7 原題未重述「壓力桶」；每題獨立提問，不能假設模型延續前題語境。');
add('四筆只回了開場，需另列答題品質',`<p class="lead">Grok 的 <b>A1、A3、A5、B6</b> 都以正常停止狀態回傳，卻未展開所要求的內容。</p><div class="cols"><div>${Q('A5')}${quote('grok','A5',plain(rec('grok','A5').answer),true)}</div><div>${Q('B6')}${quote('grok','B6',plain(rec('grok','B6').answer),true)}<div class="callout caution">A5 引用資料含官網，但正文沒有廠商名單。<br>「有來源」與「有回答」必須分開。</div></div></div>`,
'這是對前一次 72 筆成功回傳的語義補查：API 層成功並不表示完整答題。四筆保持原樣，不偷偷補答案或刪出分母。本簡報沒有重新呼叫付費 API；下一輪先補上答題完整度檢查，重試另存新回合再比较。Grok B7 則屬部分概述，不列入這四筆。',
'72/72 API 回傳；本次另標記 4 筆僅開場、1 筆錯認品牌。其餘回答不代表所有技術事實均已核實。');
add('點名品牌後，仍缺少支持「更好」的證據',`<div class="cols"><div>${Q('B1')}${quote('openai','B1',excerpt('openai','B1','但公開資料還不足以證明','總成本更低'),true)}<p class="caption">品牌背景、客製能力可以支援初步接洽；長期供應承諾仍需要具體紀錄。</p></div><div>${Q('B2')}${quote('openai','B2',excerpt('openai','B2','目前查到的資料以兩家原廠說明為主','不能直接量化。'),true)}<p class="caption">差異比較可從同用途、同級距型號開始；優越性要有相同條件的量測支持。</p></div></div><div class="callout">建議新增可公開的證據：測試條件與結果、工程師署名說明、客戶同意的應用案例，以及正式服務條件。</div>`,
'這裡不是要求品牌保證全面勝過競品。真正能降低採購不確定性的，是把同級型號與測試條件交代清楚。可以先做規格比較；沒有同條件實驗時，就不要寫壽命更長或更省電的結論。',
'B 題已包含品牌；41/42 有官網引用來源，不應算成 41 次「自然發現品牌」。');
add('測試次數已有內容，仍有取用與措辭問題',`<p class="q">B5｜${esc(question('B5'))}</p><div class="cols"><div>${quote('openai','B5',excerpt('openai','B5','官方公布的壓力循環測試要求為','100,000 次（10 萬次）'),true)}<p class="caption">GPT 讀到數字，同時提醒逐桶檢驗與循環耐久測試不能混為一談。</p></div><div>${quote('claude','B5',excerpt('claude','B5','搜尋結果中並未找到','內部測試規格數字'),true)}<p class="caption">Claude 沒找到數字。不能據此說官網完全沒有相關內容。</p></div></div><div class="callout caution">9/23 查閱英文 FAQ，已有次數、壓力區間與「每一單位」的表述。應由品保核對實際是逐桶或抽樣、適用型號及測試報告，並統一中英文。</div>`,

`模型回答與現行頁面分開比較。現行來源：${link('AQUASKY 英文 FAQ',source.faq)}（查閱 2026.09.23）。`);
add('經銷條件需要更清楚的適用範圍',`<p class="q">B6｜${esc(question('B6'))}</p><div class="cols"><div>${quote('openai','B6',excerpt('openai','B6','「標準色無 MOQ」','在同一頁並存。'),true)}<p class="caption">GPT 讀到兩組條件，明確要求確認產品層級與整筆訂單如何適用。</p></div><div>${quote('perplexity','B6',excerpt('perplexity','B6','AQUASKY 並沒有清楚公開','標準交期'),true)}<p class="caption">Perplexity 沒取得數字；DeepSeek 則自行解釋成不同層級，仍需業務確認。${ev('deepseek','B6','查看 DeepSeek 的解釋')}</p></div></div><div class="callout">下一版合作頁分列：試單／經銷訂單、標準色／客製色、型號混裝、交期起算點與回覆窗口。無法公開的數字就明確交代詢價流程。</div>`,
'這是轉換前最容易讓採購猶豫的地方。不是要求業務公開所有底價，而是把公開資訊的適用範圍寫清楚。官網已有兩組 MOQ，先確認政策，再用例子說明。不要讓模型自行把政策拼成承諾。交期目前回答沒有可靠天數，不在簡報代填。',
`現行 FAQ 同時列有標準色、客製色及經銷訂單條件：${link('查閱原頁',source.faq)}。`);
add('保固資訊要連到型號、地區與處理方式',`<p class="q">B7｜${esc(question('B7'))}</p><div class="cols"><div>${quote('openai','B7',excerpt('openai','B7','目前查到的公開 FAQ 未明列','過保維修收費'),true)}<p class="caption">有一般年限與限制，還不足以回答客戶遇到故障時的完整流程。</p></div><div><h3>建議發布一份有版本的保固表</h3><ul class="steps"><li>產品系列／型號 × 適用市場</li><li>保固起算日、涵蓋範圍、排除項目</li><li>申請證據、審核流程與聯絡窗口</li><li>更換安排、運費及停機成本責任</li></ul></div></div><div class="callout caution">模型引用 FAQ 與舊版說明書。業務與品保應先核定適用版本，再同步中英文、產品頁與下載文件。</div>`,

add('下次會議，追蹤相同問題與可驗證的修正',`<div class="thirds"><div class="rule"><div class="big accent">01</div><h3>先核定，約第 1 週</h3><p class="caption">確認正式品牌命名、MOQ、保固與認證型號；品保核對測試用語。盤點既有平台帳號。</p></div><div class="rule"><div class="big accent">02</div><h3>補內容，約第 2–3 週</h3><p class="caption">完成品牌／合作條件修訂及一組型號比較、選型內容；同步少量相關外部渠道。</p></div><div class="rule"><div class="big accent">03</div><h3>再驗證，下次會議前</h3><p class="caption">固定原 12 題 × 6 模型，保留每次完整回答；先檢查答題完整度，再比較提及與正確性。</p></div></div><table class="compact" style="margin-top:18px"><thead><tr><th>每次固定報告</th><th>本次基準</th><th>下一輪看什麼</th></tr></thead><tbody><tr><td>A 題文字提及／Plus</td><td>11/30；Plus 0/30</td><td>逐題增加或流失；不挑最好的一次</td></tr><tr><td>品牌與回答品質</td><td>1 筆錯品牌、1 筆名稱誤寫；4 筆僅開場</td><td>異常是否修正；同題重跑另存</td></tr><tr><td>採購資訊的可用性</td><td>MOQ、保固、比較證據有待釐清</td><td>是否讀到正確範圍、型號與新版本</td></tr></tbody></table>`,

$('#stage').innerHTML=slides.map((s,i)=>`<section class="slide ${s.dark?'dark':''} ${s.html.includes('class="matrix"')?'matrix-slide':''}" data-slide="${i}" aria-label="第 ${i+1} 頁 ${esc(s.title)}"><div class="eyebrow">AQUASKY · AI SEARCH REVIEW · SEPTEMBER 2026</div><h${i===0?'1':'2'}>${esc(s.title)}</h${i===0?'1':'2'}><div class="body">${s.html}</div><footer class="foot"><span>${s.foot}</span><span class="num">${String(i+1).padStart(2,'0')} / ${slides.length}</span></footer></section>`).join('');
$('#jump').innerHTML=slides.map((s,i)=>`<option value="${i}">${i+1}. ${esc(s.title)}</option>`).join('');
let current=0,lastFocus=null,modalLayer=60;
function resize(){if(document.body.classList.contains('readmode'))return;let s=Math.min(innerWidth/1440,(innerHeight-58)/810);$('#stage').style.transform=`scale(${s})`}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===current));$('#jump').value=current;$('#progress').style.width=((current+1)/slides.length*100)+'%';$('#prev').disabled=current===0;$('#next').disabled=current===slides.length-1;history.replaceState(null,'','#slide-'+(current+1));if(document.body.classList.contains('readmode'))document.querySelector(`[data-slide="${current}"]`).scrollIntoView({behavior:'smooth'})}
function showModal(id){lastFocus=document.activeElement;$(id).style.zIndex=++modalLayer;$(id).classList.add('open');$(id+' .close').focus()}
function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'));if(lastFocus)lastFocus.focus()}
function renderMarkdown(text){const safe=text.replace(/</g,'&lt;').replace(/>/g,'&gt;');let out=marked.parse(safe,{breaks:false});const wrapper=document.createElement('div');wrapper.innerHTML=out;wrapper.querySelectorAll('a').forEach(a=>{if(!/^https?:\/\//i.test(a.getAttribute('href')||''))a.removeAttribute('href');a.target='_blank';a.rel='noopener noreferrer'});return wrapper.innerHTML}
function highlightAnswer(node){const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('a,code,pre,mark')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const texts=[];while(walker.nextNode())texts.push(walker.currentNode);for(const n of texts){if(/aqua\s*sky|溢康/i.test(n.textContent)){let span=document.createElement('span');span.innerHTML=mark(n.textContent);n.replaceWith(span)}}}
function openAnswer(id){let r=R.find(x=>x.id===id);if(!r)return;$('#answerTitle').textContent=r.model_name+' · '+r.question_id;$('#answerContent').innerHTML=`<p class="q">${esc(r.question)}</p><p class="recordmeta">回傳時間 ${esc(r.timestamp)} · ${esc(r.model_id)} · 搜尋 ${esc(r.search_engine)}<br>文字提及 ${r.text_brand?'有':'無'} · Plus 文字 ${r.text_plus?'有':'無'} · aquaskyplus.com 結構化引用 ${r.official_cited?'有':'無'}</p>${r.review_flags.length?`<div class="flags"><b>審閱註記</b><br>${r.review_flags.map(esc).join('<br>')}</div>`:''}<p class="small muted">以下為模型原文，含未核實敘述；黃色標示供快速定位品牌文字，不代表正確性或獨立查證。</p><article class="answer" id="answerBody">${renderMarkdown(r.answer)}</article><hr><h3>模型回傳的引用來源（${r.citations.length} 筆）</h3><p class="small">以下是原始回傳的來源集合；存在於清單不保證支持每項主張。已解析的 Google 轉址以目的網址顯示。</p><ol class="citation-list">${r.citations.map(c=>{let u=c.resolved_url||c.url;return `<li>${link(c.title||u,u)}<br>${esc(u)}</li>`}).join('')}</ol><details><summary>原始 Markdown 與來源識別</summary><p class="recordmeta">來源批次 ${esc(r.source_run)}<br>答案 SHA-256 ${r.answer_sha256}</p><pre class="rawtext">${esc(r.answer)}</pre></details>`;highlightAnswer($('#answerBody'));showModal('#answerModal');$('#answerModal .modalbox').scrollTop=0}
function renderLibrary(){let m=$('#modelFilter').value,q=$('#questionFilter').value,s=$('#stateFilter').value,t=$('#searchFilter').value.trim().toLowerCase();let list=R.filter(r=>(!m||r.model_key===m)&&(!q||r.question_id===q)&&(!t||(r.question+' '+r.answer).toLowerCase().includes(t))&&(!s||(s==='plus'?r.text_plus:s==='brand'?r.text_brand:s==='absent'?!r.text_brand:s==='flagged'?r.review_flags.length:s==='intro'?r.intro_only:r.wrong_entity)));$('#libraryCount').textContent=`${list.length} / 72`;$('#records').innerHTML=list.length?list.map(r=>`<div class="recordrow"><button data-evidence="${r.id}"><b>${esc(r.model_name)} · ${r.question_id}</b><br><small>${esc(r.question)}</small></button><span class="state">${r.wrong_entity?'品牌錯認':r.intro_only?'僅開場':r.text_plus?'Plus 文字':r.text_brand?'品牌提及':'未提及'}${r.review_flags.length?' *':''}</span></div>`).join(''):'<p class="small">沒有符合篩選的回答。請調整條件或按重設。</p>'}
$('#modelFilter').innerHTML+=Object.entries(MODELS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');$('#questionFilter').innerHTML+=DATA.questions.map(q=>`<option value="${q.id}">${q.id} ${esc(q.question.slice(0,20))}…</option>`).join('');
function openLibrary(){renderLibrary();showModal('#libraryModal')}
function showNotes(){$('#notesTitle').textContent=(current+1)+'. '+slides[current].title;$('#notesContent').textContent=slides[current].notes;showModal('#notesModal')}
$('#prev').onclick=()=>go(current-1);$('#next').onclick=()=>go(current+1);$('#jump').onchange=e=>go(+e.target.value);$('#libraryBtn').onclick=openLibrary;$('#openLibrarySlide').onclick=openLibrary;$('#notesBtn').onclick=showNotes;
$('#readBtn').onclick=()=>{document.body.classList.toggle('readmode');$('#readBtn').textContent=document.body.classList.contains('readmode')?'簡報模式':'閱讀模式';resize();go(current)};
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()};$('#fullBtn').onclick=full;
document.addEventListener('click',e=>{const b=e.target.closest('[data-evidence]');if(b)openAnswer(b.dataset.evidence);if(e.target.matches('[data-close]')){const modal=e.target.closest('.modal');modal.classList.remove('open');if(lastFocus)lastFocus.focus()}if(e.target.classList.contains('modal'))e.target.classList.remove('open')});
for(let id of ['modelFilter','questionFilter','stateFilter','searchFilter'])$('#'+id).addEventListener('input',renderLibrary);
$('#resetFilters').onclick=()=>{for(let id of ['modelFilter','questionFilter','stateFilter','searchFilter'])$('#'+id).value='';renderLibrary()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModals();return}let modal=[...document.querySelectorAll('.modal.open')].sort((a,b)=>+b.style.zIndex-+a.style.zIndex)[0];if(modal){if(e.key==='Tab'){let f=[...modal.querySelectorAll('button,a[href],input,select,summary')].filter(x=>x.offsetParent!==null),i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f.at(-1)?.focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0]?.focus()}}return}if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key.toLowerCase()==='f')full();if(e.key.toLowerCase()==='n')showNotes();if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1)});
window.addEventListener('resize',resize);resize();go(Math.max(0,(parseInt(location.hash.replace('#slide-',''))||1)-1));
window.deck={data:DATA,slides,go,openAnswer,openLibrary,renderLibrary};
</script></body></html>
